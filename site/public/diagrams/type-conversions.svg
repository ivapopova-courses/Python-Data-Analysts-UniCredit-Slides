<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img">
<title>Converting between the basic types</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b616b"/></marker></defs>
<rect x="380" y="20" width="160" height="70" rx="10" fill="#fdebd3" stroke="#c97a1c" stroke-width="2"/>
<text x="460.0" y="46" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle" xml:space="preserve">str</text>
<text x="460.0" y="70" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">"42", "8.83"</text>
<rect x="60" y="200" width="160" height="70" rx="10" fill="#e2f2e0" stroke="#4f8a45" stroke-width="2"/>
<text x="140.0" y="226" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle" xml:space="preserve">int</text>
<text x="140.0" y="250" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">42</text>
<rect x="700" y="200" width="160" height="70" rx="10" fill="#e3edfb" stroke="#3b6fc4" stroke-width="2"/>
<text x="780.0" y="226" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle" xml:space="preserve">float</text>
<text x="780.0" y="250" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">8.83</text>
<rect x="380" y="380" width="160" height="70" rx="10" fill="#ece4f8" stroke="#7b48c4" stroke-width="2"/>
<text x="460.0" y="406" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328" text-anchor="middle" xml:space="preserve">bool</text>
<text x="460.0" y="430" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">True, False</text>
<path d="M380,70 L190,198" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="40" y="104" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">int("42")    -&gt; 42</text>
<text x="40" y="123" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">int(" 42 ")  -&gt; 42</text>
<text x="40" y="142" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#c4302b" text-anchor="start" xml:space="preserve">int("3.5")   -&gt; ValueError</text>
<path d="M540,70 L730,198" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="612" y="104" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">float("8.83") -&gt; 8.83</text>
<text x="612" y="123" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#c4302b" text-anchor="start" xml:space="preserve">float("8,83") -&gt; ValueError</text>
<path d="M222,222 L698,222" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="460" y="212" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">float(5) -&gt; 5.0      5 + 0.5 -&gt; 5.5 (automatic)</text>
<path d="M698,252 L222,252" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="460" y="278" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">int(3.99) -&gt; 3 (cuts the fraction)</text>
<text x="460" y="297" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">round(3.99) -&gt; 4 (rounds)</text>
<text x="560" y="40" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">to text, from any type:</text>
<text x="560" y="60" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">str(42) -&gt; "42"   str(8.83) -&gt; "8.83"</text>
<path d="M150,272 L378,410" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<path d="M780,272 L542,410" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="560" y="420" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">False for: 0, 0.0, "", None</text>
<text x="560" y="439" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#c4302b" text-anchor="start" xml:space="preserve">True for everything else - also "0", "False"</text>
<text x="40" y="340" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">bool is an int:</text>
<text x="40" y="360" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">True + 1 -&gt; 2</text>
</svg>
