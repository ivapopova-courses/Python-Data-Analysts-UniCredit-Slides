<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img">
<title>if / elif / else: the first true condition wins</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b616b"/></marker></defs>
<path d="M200,8 L200,36" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<polygon points="200,38.0 325.0,70 200,102.0 75.0,70" fill="#fdebd3" stroke="#c97a1c" stroke-width="2"/>
<text x="200" y="75" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">if condition_1:</text>
<polygon points="200,148.0 325.0,180 200,212.0 75.0,180" fill="#fdebd3" stroke="#c97a1c" stroke-width="2"/>
<text x="200" y="185" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">elif condition_2:</text>
<path d="M325,70 L398,70" fill="none" stroke="#4f8a45" stroke-width="2.2" marker-end="url(#head)"/>
<text x="360" y="62" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#4f8a45" text-anchor="middle" xml:space="preserve">True</text>
<rect x="400" y="44" width="170" height="52" rx="10" fill="#e2f2e0" stroke="#4f8a45" stroke-width="2"/>
<text x="485.0" y="70" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle" xml:space="preserve">block 1</text>
<path d="M325,180 L398,180" fill="none" stroke="#4f8a45" stroke-width="2.2" marker-end="url(#head)"/>
<text x="360" y="172" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#4f8a45" text-anchor="middle" xml:space="preserve">True</text>
<rect x="400" y="154" width="170" height="52" rx="10" fill="#e2f2e0" stroke="#4f8a45" stroke-width="2"/>
<text x="485.0" y="180" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle" xml:space="preserve">block 2</text>
<path d="M200,102 L200,146" fill="none" stroke="#c4302b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="210" y="128" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#c4302b" text-anchor="start" xml:space="preserve">False</text>
<path d="M200,212 L200,256" fill="none" stroke="#c4302b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="210" y="238" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" fill="#c4302b" text-anchor="start" xml:space="preserve">False</text>
<rect x="75" y="258" width="250" height="62" rx="10" fill="#f3f1ec" stroke="#8c8578" stroke-width="2"/>
<text x="200.0" y="284" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle" xml:space="preserve">block 3</text>
<text x="200.0" y="308" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle" xml:space="preserve">else: when no condition was true</text>
<path d="M570,70 L640,70 L640,352" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<path d="M570,180 L640,180" fill="none" stroke="#5b616b" stroke-width="2.2"/>
<path d="M200,320 L200,352" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<path d="M640,352 L640,362 L420,362" fill="none" stroke="#5b616b" stroke-width="2.2"/>
<rect x="75" y="362" width="590" height="48" rx="10" fill="#e3edfb" stroke="#3b6fc4" stroke-width="2"/>
<text x="370" y="392" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle" xml:space="preserve">the code after the if statement</text>
<text x="690" y="60" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b616b" text-anchor="start" xml:space="preserve">The same in SQL:</text>
<text x="690" y="84" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">CASE</text>
<text x="690" y="103" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">  WHEN condition_1</text>
<text x="690" y="122" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">    THEN ...</text>
<text x="690" y="141" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">  WHEN condition_2</text>
<text x="690" y="160" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">    THEN ...</text>
<text x="690" y="179" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">  ELSE ...</text>
<text x="690" y="198" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">END</text>
<text x="690" y="240" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">Only one block runs.</text>
<text x="690" y="259" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">The later conditions are not</text>
<text x="690" y="278" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">even tested.</text>
</svg>
