<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img">
<title>One lookup table, three forms</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b616b"/></marker></defs>
<rect x="15" y="20" width="280" height="210" rx="10" fill="#fdebd3" stroke="#c97a1c" stroke-width="2"/>
<text x="29" y="46" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">SAS: a format</text>
<text x="29" y="74" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">proc format;</text>
<text x="29" y="94" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">  value $prod</text>
<text x="29" y="114" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">    'mortgage'  = 'Mortgage loan'</text>
<text x="29" y="134" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">    'overdraft' = 'Overdraft'</text>
<text x="29" y="154" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">    other       = 'Other';</text>
<text x="29" y="174" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">run;</text>
<text x="29" y="264" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">use it:</text>
<text x="29" y="284" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">put(code, $prod.)</text>
<text x="29" y="308" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">not found:</text>
<text x="29" y="328" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">other = 'Other'</text>
<rect x="315" y="20" width="280" height="210" rx="10" fill="#e3edfb" stroke="#3b6fc4" stroke-width="2"/>
<text x="329" y="46" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">SQL: a lookup table</text>
<text x="329" y="74" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">TABLE product_names</text>
<text x="329" y="94" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">code       name</text>
<text x="329" y="114" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">---------  -------------</text>
<text x="329" y="134" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">mortgage   Mortgage loan</text>
<text x="329" y="154" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">overdraft  Overdraft</text>
<text x="329" y="264" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">use it:</text>
<text x="329" y="284" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">LEFT JOIN ... ON code</text>
<text x="329" y="308" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">not found:</text>
<text x="329" y="328" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">COALESCE(name, 'Other')</text>
<rect x="615" y="20" width="280" height="210" rx="10" fill="#e2f2e0" stroke="#4f8a45" stroke-width="2"/>
<text x="629" y="46" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">Python: a dictionary</text>
<text x="629" y="74" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">product_names = {</text>
<text x="629" y="94" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">  "mortgage": "Mortgage loan",</text>
<text x="629" y="114" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">  "overdraft": "Overdraft",</text>
<text x="629" y="134" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">}</text>
<text x="629" y="264" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">use it:</text>
<text x="629" y="284" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">product_names[code]</text>
<text x="629" y="308" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">not found:</text>
<text x="629" y="328" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">product_names.get(code, "Other")</text>
</svg>
