<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img">
<title>A nomenclature as a class</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b616b"/></marker></defs>
<rect x="20" y="20" width="430" height="250" rx="10" fill="#e3edfb" stroke="#3b6fc4" stroke-width="2"/>
<text x="40" y="48" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">class Nomenclature</text>
<rect x="40" y="70" width="390" height="40" rx="6" fill="#f3f1ec" stroke="#8c8578" stroke-width="2"/>
<text x="54" y="87" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">data</text>
<text x="54" y="103" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">codes: {code: label}</text>
<rect x="40" y="118" width="390" height="40" rx="6" fill="#f3f1ec" stroke="#8c8578" stroke-width="2"/>
<text x="54" y="135" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">metadata</text>
<text x="54" y="151" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">name, version, valid_from, owner</text>
<rect x="40" y="166" width="390" height="40" rx="6" fill="#f3f1ec" stroke="#8c8578" stroke-width="2"/>
<text x="54" y="183" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">validation rules</text>
<text x="54" y="199" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">__post_init__, validate(values)</text>
<rect x="40" y="214" width="390" height="40" rx="6" fill="#f3f1ec" stroke="#8c8578" stroke-width="2"/>
<text x="54" y="231" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">processing methods</text>
<text x="54" y="247" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#5b616b" text-anchor="start" xml:space="preserve">lookup(), apply(rows, ...), the unmapped report</text>
<rect x="520" y="20" width="380" height="60" rx="10" fill="#e2f2e0" stroke="#4f8a45" stroke-width="2"/>
<text x="534" y="46" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">BandedNomenclature</text>
<text x="534" y="70" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">ranges: DPD, PD -&gt; grade</text>
<rect x="520" y="100" width="380" height="60" rx="10" fill="#e2f2e0" stroke="#4f8a45" stroke-width="2"/>
<text x="534" y="126" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">HierarchicalNomenclature</text>
<text x="534" y="150" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">code -&gt; parent</text>
<rect x="520" y="200" width="380" height="70" rx="10" fill="#fdebd3" stroke="#c97a1c" stroke-width="2"/>
<text x="534" y="226" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="start" xml:space="preserve">Registry</text>
<text x="534" y="250" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2328" text-anchor="start" xml:space="preserve">has nomenclatures; applies them</text>
<path d="M516,50 L454,80" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="486" y="56" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle" xml:space="preserve">is a</text>
<path d="M516,130 L454,130" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="486" y="124" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle" xml:space="preserve">is a</text>
<path d="M516,235 L454,220" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)" stroke-dasharray="6 4"/>
<text x="486" y="248" font-family="Segoe UI, Noto Sans, Roboto, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#5b616b" text-anchor="middle" xml:space="preserve">has</text>
<path d="M710,272 L710,310" fill="none" stroke="#5b616b" stroke-width="2.2" marker-end="url(#head)"/>
<text x="710" y="334" font-family="JetBrains Mono, Cascadia Code, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle" xml:space="preserve">loans.csv, clients.csv, ratings_history.csv, ...</text>
</svg>
